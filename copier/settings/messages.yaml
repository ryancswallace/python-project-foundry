### User-facing messages shown before/after copy and update

_message_before_copy: |

  Scaffolding your new project with {{ '\u001b[1m' }}python-project-foundry{{ '\u001b[0m' }}!

  Steps:
    → Answer questions about your project
    → We'll scaffold your project
    → (optional) We'll run setup tasks

  👉 Abort anytime with Ctrl+C

_message_after_copy: |

  ✅  {{ project_name }} is ready in {{ _copier_conf.dst_path }}.

  Next steps
    → cd {{ _copier_conf.dst_path }}
    → make check

  Configured destinations (available after publishing)
    repository: {{ repository_url }}
    documentation: {{ documentation_url }}

  Publish when ready
    uvx python-project-foundry publish --visibility <private|public|internal>

  Thanks for using {{ '\u001b[1m' }}✨ python-project-foundry ✨{{ '\u001b[0m' }}  Have fun building! 🎉

_message_before_update: |

  Updating your existing project with {{ '\u001b[1m' }}python-project-foundry{{ '\u001b[0m' }}!

  Steps:
    → We'll apply template changes and run any defined migrations
    → You may be asked to resolve conflicts if both you and the template changed the same lines

  👉 Abort anytime with Ctrl+C

_message_after_update: |

  ✅  Update complete.

  Next steps:
    → Review the diff and resolve any inline conflicts
    → Re-run any quality checks (e.g., `make test`)
    → Commit your changes when satisfied

  Configured destinations
    repository: {{ repository_url }}
    documentation: {{ documentation_url }}

  Thanks for using {{ '\u001b[1m' }}✨ python-project-foundry ✨{{ '\u001b[0m' }}  Have fun building! 🎉
