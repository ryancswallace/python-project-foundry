### Update-time migrations for `copier update`

_migrations: []

# Add versioned before/after commands here when an update requires data or file
# transformations beyond Copier's three-way merge. Keep the setting as a list,
# even when no migrations are defined.
#
# Example:
# _migrations:
#   - version: "1.0.0"
#     before:
#       - "python {{ _copier_conf.src_path }}/migrations/prepare_v1.py"
#     after:
#       - "python {{ _copier_conf.src_path }}/migrations/finish_v1.py"
