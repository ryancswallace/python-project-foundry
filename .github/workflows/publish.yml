name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/0.11.33/install.sh \
            | env UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv-bin/uv" --version

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Run checks
        run: make check

      - name: Build distributions
        run: uv run python -m build

      - name: Validate distributions
        run: uv run twine check --strict dist/*

      - name: Stage publishing tool
        shell: bash
        run: |
          mkdir -p .release-tools
          cp "$(command -v uv)" .release-tools/uv
          chmod 0555 .release-tools/uv

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload publishing tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-publisher
          path: .release-tools/uv
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/python-project-foundry/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Download publishing tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uv-publisher
          path: .release-tools/

      - name: Publish distributions to PyPI
        shell: bash
        run: |
          chmod 0555 .release-tools/uv
          .release-tools/uv publish --trusted-publishing always dist/*
