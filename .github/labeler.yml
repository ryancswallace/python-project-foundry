# Pull request labels applied by actions/labeler.
# Every key in this file must have a matching definition in .github/labels.yml.

# Skip path-based labeling for unusually broad changes instead of flooding a
# pull request with labels. See actions/labeler for the precise limit behavior.
changed-files-labels-limit: "8"
max-files-changed: "200"

documentation:
  - head-branch:
      - "^docs?(?:/|$)"
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "site/**"
          - "assets/**"
          - CITATION.cff

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - .github/dependabot.yml
          - .github/labeler.yml
          - .github/labels.yml

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

dependencies:
  - head-branch:
      - "^dependabot/"
      - "^deps?(?:/|$)"
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
          - .github/dependabot.yml
          - ".devcontainer/devcontainer-lock.json"

containers:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile*"
          - ".dockerignore"
          - "*.dockerignore"
          - ".devcontainer/Dockerfile"

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - Dockerfile
          - .dockerignore
          - LICENSE

security:
  - changed-files:
      - any-glob-to-any-file:
          - SECURITY.md
          - .github/dependabot.yml
          - .github/workflows/codeql.yml
          - .github/workflows/scorecard.yml
          - Dockerfile

automation:
  - changed-files:
      - any-glob-to-any-file:
          - Makefile
          - "devel/**"
          - cspell.json
          - .editorconfig
          - .gitattributes
          - "Dockerfile*"
          - "*.dockerignore"

dev-environment:
  - changed-files:
      - any-glob-to-any-file:
          - ".devcontainer/**"
          - ".vscode/**"
          - .editorconfig

release:
  - head-branch:
      - "^(?:release|prepare-release)(?:/|$)"
  - changed-files:
      - any-glob-to-any-file:
          - CHANGELOG.md
          - RELEASE.md
          - .github/workflows/release.yml

maintenance:
  - head-branch:
      - "^(?:chore|maintenance)(?:/|$)"
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - AGENTS.md
          - CODEOWNERS
          - .gitattributes
          - .gitignore
