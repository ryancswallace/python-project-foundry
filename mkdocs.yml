site_name: Python Project Foundry
site_description: Scaffold maintainable Python package/library repositories with one command.
site_author: Ryan Wallace
site_url: https://ryancswallace.github.io/python-project-foundry/
repo_name: ryancswallace/python-project-foundry
repo_url: https://github.com/ryancswallace/python-project-foundry
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ryan Wallace

docs_dir: docs
site_dir: site
strict: true

watch:
  - src/python_project_foundry

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

theme:
  name: material
  locale: en
  font: false
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

exclude_docs: |
  _scripts/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/_scripts/gen_api_reference.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Configure a project: guides/configure.md
      - Develop a generated project: guides/development.md
      - Publish to GitHub: guides/publish.md
  - Guides:
      - Guides overview: guides/index.md
      - Automate generation: guides/unattended.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Reference overview: reference/index.md
      - Command line: reference/cli.md
      - Questionnaire: reference/questionnaire.md
      - Generated project: reference/generated-project.md
      - Python API:
          - Package: reference/api/index.md
          - CLI module: reference/api/cli.md
          - Publishing module: reference/api/publishing.md
  - Explanation:
      - How it works: explanation/how-it-works.md
  - Contributing:
      - Development: contributing/development.md
      - Template development: contributing/template.md
      - Documentation: contributing/documentation.md
